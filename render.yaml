# ============================================================================
# GRIOT AI — RENDER DEPLOYMENT BLUEPRINT (render.yaml)
# Deploys GRIOT AI Core on Render connected to Supabase PostgreSQL via GRIOT_DATABASE_URL.
# ============================================================================

services:
  - type: web
    name: griot-ai-core
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run typecheck
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22.23.5"
      - key: NODE_ENV
        value: production
      - key: GRIOT_ENV
        value: production
      - key: GRIOT_HOST
        value: "0.0.0.0"
      - key: GRIOT_ALLOW_MOCK_PROVIDERS
        value: "false"
      - key: GRIOT_STORAGE_DURABLE
        value: "false"
      - key: GRIOT_ALLOWED_ORIGINS
        value: "https://lovable.dev,https://*.lovable.app,https://*.lovableproject.com"
      - key: GRIOT_DATABASE_URL
        sync: false
      - key: GRIOT_JWT_SECRET
        sync: false
      - key: GRIOT_VAULT_MASTER_KEY
        sync: false
      - key: GRIOT_FILE_SIGNING_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPEN_WEIGHT_API_KEY
        sync: false
      - key: OPEN_WEIGHT_BASE_URL
        sync: false
